# Release (R1-release, docs/release.md). Runs when a tag v* is pushed; nothing is
# published by merging. Steps: the ci.yml checks, a green integration.yml run on the same
# commit, signed Android AAB + APK and iOS IPA from GitHub secrets, a GitHub Release with
# the files attached, and (off by default) fastlane uploads to Play internal / TestFlight.
# Secrets and variables are listed in docs/release.md. Needs the models-v1 release assets
# (tools/ci/fetch_models.py downloads the bundled light model from it).
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  checks:
    name: ci checks
    uses: ./.github/workflows/ci.yml

  integration-gate:
    name: green integration run on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pubspec.yaml
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "tag=$want pubspec=$have"
          test "$want" = "$have" || { echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $have"; exit 1; }
      - name: integration.yml succeeded on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/integration.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "$n" -lt 1 ]; then
            echo "::error::No green integration run for $GITHUB_SHA. Tag a commit on main after integration.yml passes (or run it with workflow_dispatch on this commit)."
            exit 1
          fi

  android:
    name: android signed build
    needs: [checks, integration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/julia* /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /opt/hostedtoolcache/CodeQL /opt/microsoft
          sudo docker image prune --all --force > /dev/null
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bundled light model (SHA-256 checked)
        run: python3 tools/ci/fetch_models.py --tier light --cache .model-cache
      - run: flutter pub get
      - name: Write the upload keystore (never printed, never uploaded)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB and split-per-ABI APKs
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
        run: |
          defines=()
          if [ -n "$FEEDBACK_EMAIL" ]; then defines+=("--dart-define=FEEDBACK_EMAIL=$FEEDBACK_EMAIL"); fi
          flutter build appbundle --release "${defines[@]}"
          flutter build apk --release --split-per-abi "${defines[@]}"
      - name: App size (download target 150 MB)
        run: |
          python3 -m tools.release.app_size build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          python3 -m tools.release.app_size build/app/outputs/bundle/release/app-release.aab --limit-mb 200
      - name: Collect files
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/uk-pronunciation-coach-${GITHUB_REF_NAME}.aab"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/uk-pronunciation-coach-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/uk-pronunciation-coach-${GITHUB_REF_NAME}-armeabi-v7a.apk" || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/uk-pronunciation-coach-${GITHUB_REF_NAME}-x86_64.apk" || true
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: ios signed build
    needs: [checks, integration-gate]
    # Skipped until the iOS signing secrets exist, so an Android-only beta can ship.
    if: ${{ vars.BUILD_IOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bundled light model (SHA-256 checked)
        run: python3 tools/ci/fetch_models.py --tier light --cache .model-cache
      - run: flutter pub get
      - name: Import the distribution certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          for v in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_PROFILE_NAME; do
            test -n "${!v}" || { echo "::error::$v is not set"; exit 1; }
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          kpass="$(uuidgen)"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/release.mobileprovision"
          rm -f "$RUNNER_TEMP/dist.p12"
          cat > ios/Flutter/Signing.xcconfig <<XC
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $IOS_PROFILE_NAME
          XC
          envsubst < ios/ExportOptions.plist.template > ios/ExportOptions.plist
      - name: Build the signed IPA
        env:
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
        run: |
          defines=()
          if [ -n "$FEEDBACK_EMAIL" ]; then defines+=("--dart-define=FEEDBACK_EMAIL=$FEEDBACK_EMAIL"); fi
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist "${defines[@]}"
      - name: App size (download target 150 MB)
        run: python3 -m tools.release.app_size build/ios/ipa/*.ipa
      - name: Collect files
        run: |
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/uk-pronunciation-coach-${GITHUB_REF_NAME}.ipa"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" ios/Flutter/Signing.xcconfig ios/ExportOptions.plist
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: github release
    needs: [android, ios]
    # Runs when ios was skipped; still blocked if android or ios actually failed.
    if: ${{ always() && needs.android.result == 'success' && needs.ios.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release (draft; publish it by hand after checking)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft "${prerelease[@]}" \
            --title "UK Pronunciation Coach $GITHUB_REF_NAME" --generate-notes

  # Off by default: set the repository variable UPLOAD_TO_STORES to "true" (and add the
  # store secrets in docs/release.md). Uploads go to Play internal testing and TestFlight only.
  upload-play-internal:
    name: fastlane to Play internal
    needs: [android]
    if: ${{ vars.UPLOAD_TO_STORES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane -v 2.226.0 --no-document
      - name: Upload the AAB to the internal track
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_JSON_KEY" || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          printf '%s' "$PLAY_JSON_KEY" > "$RUNNER_TEMP/play.json"
          fastlane supply --aab dist/*.aab --track internal --release_status draft \
            --package_name uk.pronunciationcoach.uk_pronunciation_coach \
            --json_key "$RUNNER_TEMP/play.json" --skip_upload_metadata --skip_upload_images \
            --skip_upload_screenshots
          rm -f "$RUNNER_TEMP/play.json"

  upload-testflight:
    name: fastlane to TestFlight
    needs: [ios]
    if: ${{ vars.UPLOAD_TO_STORES == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios-release
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane -v 2.226.0 --no-document
      - name: Upload the IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            test -n "${!v}" || { echo "::error::$v is not set"; exit 1; }
          done
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg key "$ASC_KEY_P8" \
            '{key_id:$k, issuer_id:$i, key:$key, in_house:false}' > "$RUNNER_TEMP/asc.json"
          fastlane pilot upload --ipa dist/*.ipa --api_key_path "$RUNNER_TEMP/asc.json" \
            --skip_waiting_for_build_processing true
          rm -f "$RUNNER_TEMP/asc.json"
